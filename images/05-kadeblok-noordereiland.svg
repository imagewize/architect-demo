<title id="v5-title">Kadeblok Noordereiland — voorgevel aan de kade</title>
<desc id="v5-desc">Vier geschakelde panden in een blok van 25 meter breed met zadeldaken aan de kade, elk met twee ramen per verdieping en één oranje deur, met water en een afgemeerd binnenvaartschip aan de rechterkant.</desc>
