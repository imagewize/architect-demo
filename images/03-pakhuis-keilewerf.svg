<title id="v3-title">Pakhuis Keilewerf — voorgevel aan de kade</title>
<desc id="v3-desc">Pakhuis met trapgevel, metselverband, twee rijen kleine ramen, oranje laaddeur met hijsbalk, aanbouw met zaagdak en studiobeglazing, kade met water en een binnenvaartschip.</desc>
