<title id="v1-title">Villa Veldzicht — voorgevel</title>
<desc id="v1-desc">Moderne villa: glazen paviljoen op de begane grond onder een uitkragende dakplaat, verschoven bovenbouw met drie ramen, oranje voordeur, twee bomen en twee schaalfiguren.</desc>
