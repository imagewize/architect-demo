<title id="v4-title">De Hoeksteen — voorgevel</title>
<desc id="v4-desc">Voormalige kerk: schip van 20 meter breed met zadeldak, toren met spits, drie hoge smalle vensters in het schip, een venster in de toren en een oranje ingangsportaal. Twee bomen en twee schaalfiguren.</desc>
