<title id="hero-title">Doorsnede bestaand pakhuis</title>
<desc id="hero-desc">Doorsnede door een bestaand pakhuis van 16 bij 13 meter: zadeldakprofiel, twee gesneden kopwanden in zwart poche, twee ingevoegde vloerplaten, een trap van de begane grond naar de eerste verdieping, een maatvoering van 16,0 m en twee schaalfiguren waarvan één oranje.</desc>
