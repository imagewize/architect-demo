<title id="v6-title">De Bergweg — voorgevel</title>
<desc id="v6-desc">Voormalige school: langgerekt blok met zaagdak van vijf tanden, schoorsteen op een tand, een lange band van zeven ramen met bovendorpel en een oranje dubbele entree. Twee bomen en twee schaalfiguren.</desc>
