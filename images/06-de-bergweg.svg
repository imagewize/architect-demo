<title id="v6-title">De Bergweg — voorgevel</title>
<desc id="v6-desc">Voormalige school: langgerekt blok met zaagdak van zes tanden, schoorsteen, een lange band van acht ramen met bovendorpel en een oranje dubbele entree. Twee bomen en twee schaalfiguren.</desc>
